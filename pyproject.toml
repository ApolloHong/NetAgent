[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-demo"
version = "0.2.0"
description = "Operational intelligence layer on a network digital twin: heartbeat detection + counterfactual root-cause analysis, with optional real backends (EVE-NG, junos-mcp-server, NUAR, Batfish, gNMI, NautilusTrader)"
requires-python = ">=3.11"
license = { text = "MIT" }
# CORE stays exactly as before: the offline all-sim default needs only these.
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# EVE-NG REST + junos-mcp-server (streamable-http JSON-RPC) transports
eve = ["httpx>=0.27"]
# NUAR export adapter is stdlib-only; the extra exists for future API deps
nuar = []
# Batfish static what-if counterfactual (pybatfish 2025.07.07 verified)
batfish = ["pybatfish>=2024.7"]
# gNMI streaming telemetry feed (pygnmi 0.8.15 verified)
gnmi = ["pygnmi>=0.8.15"]
# Optional replay/live engine for the telemetry lane ONLY.
# LGPL-3.0 dependency — deliberately isolated in this extra so the core
# project stays permissively licensed (see README "NautilusTrader tradeoff").
# API usage verified against the NautilusTrader master docs, 2026-07.
nautilus = ["nautilus_trader>=1.190"]
# LLM reasoner + LLM judge (Anthropic Messages API)
llm = ["anthropic>=0.40"]
# Annotated topology PNG
viz = ["matplotlib>=3.7"]
# Full-YAML config files (a built-in minimal parser covers the example file)
yaml = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["demo*"]

[tool.setuptools.package-data]
"demo.fixtures" = ["**/*.json", "**/*.set"]
